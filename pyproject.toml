[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-databricks-mcp-agent"
version = "0.1.0"
description = "Multi-user web app: a Microsoft Agent Framework agent (Azure AI Foundry model) using Azure Databricks managed MCP tools (Unity Catalog functions + Genie), with per-user On-Behalf-Of or shared app identity for Databricks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "agent-framework>=1.0.0b251114",
    "agent-framework-foundry>=1.0.0b251114",
    "azure-ai-projects>=2.2.0",
    "azure-identity>=1.19.0",
    "azure-cosmos>=4.9.0",
    "mcp>=1.13.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# The multi-user web UI (foundry_databricks_agent.webapp). Install with: pip install .[web]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Optional: interactive Entra ID sign-in for local browser testing (auth-code flow).
    "msal>=1.28.0",
]

# OpenTelemetry export of agent/model/tool spans. Install with: pip install .[tracing]
tracing = [
    # Application Insights exporter; also instruments FastAPI and outbound HTTP.
    "azure-monitor-opentelemetry>=1.6.0",
    # OTLP export to a collector or the Foundry Toolkit trace viewer in VS Code.
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

# Offline agent evaluation (evals/). Install with: pip install .[evals]
evals = [
    "azure-ai-evaluation>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
